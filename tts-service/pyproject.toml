[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-service"
version = "1.0.0"
description = "Text-to-Speech microservice for Autobots Transportation Network Analysis System"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Autobots Team"}
]
keywords = ["tts", "text-to-speech", "microservice", "transportation", "autobots"]

dependencies = [
    "Flask>=3.0.0",
    "Flask-CORS>=4.0.0",
    "gTTS>=2.5.0",
    "pydub>=0.25.1",
    "werkzeug>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/Abdallah4Z/Autobots"
Repository = "https://github.com/Abdallah4Z/Autobots"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
